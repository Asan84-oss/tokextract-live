<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1344" width="768" height="1344" role="img" aria-label="Demo reel thumbnail">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="0.5" stop-color="#121214"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="magBeam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fe0979" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fe0979" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.22" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMag" cx="0.8" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#fe0979" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fe0979" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#fe0979" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fe0979" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#fe0979"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="768" height="1344" fill="url(#bgFade)"/>
  <rect width="768" height="1344" fill="url(#grid)"/>
  <rect width="768" height="1344" fill="url(#glowCyan)"/>
  <rect width="768" height="1344" fill="url(#glowMag)"/>

  <!-- crossing stage beams -->
  <polygon points="-120,560 560,220 640,360 -20,720" fill="url(#cyanBeam)" opacity="0.5" filter="url(#soft)"/>
  <polygon points="888,760 208,1080 128,940 808,600" fill="url(#magBeam)" opacity="0.45" filter="url(#soft)"/>

  <!-- stage floor -->
  <ellipse cx="384" cy="1052" rx="300" ry="52" fill="url(#floor)" filter="url(#soft2)"/>
  <ellipse cx="384" cy="1046" rx="150" ry="18" fill="#00f2fe" opacity="0.16" filter="url(#soft2)"/>

  <!-- dancer silhouette, backlit -->
  <g stroke="#0b0b0e" fill="#0b0b0e" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="392" cy="330" r="40" stroke="none"/>
    <path d="M362 378 C 348 462 350 528 370 592 L 410 592 C 428 522 424 452 410 376 Z" stroke="none"/>
    <!-- raised arm -->
    <path d="M404 398 C 452 372 480 318 508 268" fill="none" stroke-width="30"/>
    <!-- extended arm -->
    <path d="M366 408 C 318 434 284 478 254 530" fill="none" stroke-width="28"/>
    <!-- kicked leg -->
    <path d="M400 580 C 444 634 490 676 534 706" fill="none" stroke-width="34"/>
    <!-- planted leg -->
    <path d="M376 584 C 372 676 372 776 378 866 C 382 934 378 992 372 1040" fill="none" stroke-width="34"/>
    <!-- feet -->
    <path d="M372 1036 L 336 1044" fill="none" stroke-width="22"/>
    <path d="M534 706 L 566 722" fill="none" stroke-width="22"/>
  </g>
  <!-- rim light on silhouette edge -->
  <g fill="none" stroke="url(#rim)" stroke-linecap="round" opacity="0.75" filter="url(#soft2)">
    <path d="M410 300 A 40 40 0 0 1 428 348" stroke-width="5"/>
    <path d="M404 398 C 452 372 480 318 508 268" stroke-width="5"/>
    <path d="M400 580 C 444 634 490 676 534 706" stroke-width="5"/>
    <path d="M424 452 C 428 512 420 556 410 592" stroke-width="5"/>
  </g>

  <!-- floating accents -->
  <g fill="#00f2fe" opacity="0.8">
    <path d="M150 250 l 14 14 -14 14 -14 -14 Z"/>
    <path d="M630 900 l 10 10 -10 10 -10 -10 Z" fill="#fe0979"/>
    <circle cx="600" cy="210" r="6" fill="#fe0979" opacity="0.7"/>
    <circle cx="180" cy="880" r="5"/>
  </g>

  <!-- equalizer strip -->
  <g transform="translate(204,1210)" fill="url(#rim)" opacity="0.85">
    <rect x="0"   y="26" width="12" height="34" rx="3"/>
    <rect x="26"  y="10" width="12" height="50" rx="3"/>
    <rect x="52"  y="30" width="12" height="30" rx="3"/>
    <rect x="78"  y="0"  width="12" height="60" rx="3"/>
    <rect x="104" y="18" width="12" height="42" rx="3"/>
    <rect x="130" y="34" width="12" height="26" rx="3"/>
    <rect x="156" y="6"  width="12" height="54" rx="3"/>
    <rect x="182" y="24" width="12" height="36" rx="3"/>
    <rect x="208" y="12" width="12" height="48" rx="3"/>
    <rect x="234" y="32" width="12" height="28" rx="3"/>
    <rect x="260" y="2"  width="12" height="58" rx="3"/>
    <rect x="286" y="20" width="12" height="40" rx="3"/>
    <rect x="312" y="36" width="12" height="24" rx="3"/>
    <rect x="338" y="14" width="12" height="46" rx="3"/>
  </g>

  <rect width="768" height="1344" fill="none" stroke="#26262e" stroke-width="2"/>
</svg>
